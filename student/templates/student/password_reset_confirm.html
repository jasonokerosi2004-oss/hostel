{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter New Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .card { width: 100%; max-width: 400px; background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; margin-bottom: 10px; font-size: 24px; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group p { margin-bottom: 10px; font-size: 13px; color: #334155; }
        input[type="password"] { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background-color: #f8fafc; }
        button[type="submit"] { width: 100%; background-color: #1e40af; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button[type="submit"]:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set New Password</h2>
        <p class="subtitle">Please enter your new password twice so we can verify you typed it in correctly.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit">Change My Password</button>
        </form>
    </div>
</body>
</html>
