{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .card { width: 100%; max-width: 400px; background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; margin-bottom: 10px; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .btn { display: inline-block; background-color: #1e40af; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Password Updated!</h2>
        <p>Your password has been set successfully. You can now log in with your new credentials.</p>
        <a href="{% url 'login' %}" class="btn">Sign In Now</a>
    </div>
</body>
</html>
