{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Email Sent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .card { width: 100%; max-width: 400px; background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; margin-bottom: 10px; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        a { color: #1e40af; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Check Your Email</h2>
        <p>We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive them shortly.<br><br><em>(Note: Locally, check your terminal window to see the generated reset link!)</em></p>
        <a href="{% url 'login' %}">Back to Sign In</a>
    </div>
</body>
</html>
