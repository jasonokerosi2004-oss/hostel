{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisii University Hostel Portal - Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }
        .right-panel {
            width: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: -4px 0 20px rgba(0,0,0,0.05);
        }
        .login-card { width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1e293b; margin-bottom: 6px; font-size: 24px; font-weight: 700; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #1e293b; font-weight: 600; font-size: 13px; }
        input[type="email"] { 
            width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; 
            border-radius: 8px; font-size: 14px; color: #334155; background-color: #f8fafc; 
        }
        button[type="submit"] { 
            width: 100%; background-color: #1e40af; color: white; padding: 12px; 
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        button[type="submit"]:hover { background-color: #1d4ed8; }
        .back-link { margin-top: 20px; font-size: 13px; }
        .back-link a { color: #1e40af; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="right-panel">
        <div class="login-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.as_p }}
                </div>
                <button type="submit">Send Reset Link</button>
            </form>

            <div class="back-link">
                <a href="{% url 'login' %}">Back to Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
