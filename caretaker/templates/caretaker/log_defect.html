<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Room Defect - Caretaker Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'caretaker_dashboard' %}"><i class="bi bi-arrow-left"></i> Back to Caretaker Dashboard</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="bi bi-tools"></i> Log Room Defect / Maintenance Issue</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form method="POST">
                            {% csrf_token %}
                            
                            <!-- Room Selection -->
                            <div class="mb-3">
                                <label for="room_id" class="form-label fw-bold">Select Affected Room</label>
                                <select class="form-select" id="room_id" name="room_id" required>
                                    <option value="" selected disabled>-- Choose Room in Assigned Hall --</option>
                                    {% for room in hall_rooms %}
                                    <option value="{{ room.room_id }}">Room {{ room.room_number }} (Type: {{ room.room_type }})</option>
                                    {% empty %}
                                    <option value="" disabled>No rooms found in your assigned hall.</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Severity Level -->
                            <div class="mb-3">
                                <label for="severity" class="form-label fw-bold">Severity Level</label>
                                <select class="form-select" id="severity" name="severity" required>
                                    <option value="Low">Low (Minor cosmetic issue)</option>
                                    <option value="Medium" selected>Medium (Standard maintenance needed)</option>
                                    <option value="High">High (Urgent repair required)</option>
                                    <option value="Severe">Severe (Safety hazard / Plumbing burst)</option>
                                </select>
                            </div>

                            <!-- Description -->
                            <div class="mb-4">
                                <label for="description" class="form-label fw-bold">Defect Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the damage, broken fixture, or maintenance issue in detail..." required></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-lg">
                                    <i class="bi bi-send-fill"></i> Submit Maintenance Report
                                </button>
                                <a href="{% url 'caretaker_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
