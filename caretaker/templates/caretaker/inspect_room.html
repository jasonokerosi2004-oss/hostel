<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Inspection - Room {{ room.room_number }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold">
                        <i class="bi bi-clipboard-check"></i> Formal Audit & Fixture Inspection - Room {{ room.room_number }}
                    </div>
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Furniture Condition</label>
                                <select name="furniture_rating" class="form-select">
                                    <option value="Good">Good (Intact)</option>
                                    <option value="Fair">Fair (Minor wear)</option>
                                    <option value="Damaged">Damaged / Broken</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Electrical Fixtures (Bulbs, Sockets, Switches)</label>
                                <select name="electrical_rating" class="form-select">
                                    <option value="Good">Good (Fully Functional)</option>
                                    <option value="Fair">Fair</option>
                                    <option value="Damaged">Faulty / Broken</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Plumbing & Sanitary (Taps, Sinks, Showers)</label>
                                <select name="plumbing_rating" class="form-select">
                                    <option value="Good">Good (No leaks)</option>
                                    <option value="Fair">Fair</option>
                                    <option value="Damaged">Leaking / Damaged</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Assessment Damage Fines (Ksh)</label>
                                <input type="number" step="0.01" name="damage_charges" class="form-control" value="0.00" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Inspector Remarks / Specific Findings</label>
                                <textarea name="remarks" class="form-control" rows="3" placeholder="Enter details regarding any observed damages..."></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'hall_room_list' %}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Submit Audit & Fines</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
